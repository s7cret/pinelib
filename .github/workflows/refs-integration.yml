name: Materialize coordinated reference and import source
'on':
  push:
    branches: ['ops/stage2-refs-integrate-20260907']
permissions:
  contents: write
concurrency:
  group: refs-integration-source
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.12.10
      - name: Restore exact source tree and commit without advancing RC6
        run: |
          git config user.name 'OpenPine Review'
          git config user.email 'openpine-review@users.noreply.github.com'
          cp .github/refs-integration/materialize.py "$RUNNER_TEMP/materialize.py"
          python "$RUNNER_TEMP/materialize.py" .github/refs-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materialized-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
