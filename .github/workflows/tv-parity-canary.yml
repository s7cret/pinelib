name: TradingView parity canary

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinelib-tv-parity-canary
  cancel-in-progress: false

jobs:
  validate-sanitized-oracle-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate TradingView oracle corpus
        run: |
          mkdir -p artifacts
          timeout 180s python scripts/run_tv_parity_canary.py \
            --json artifacts/tv-parity-canary.json \
            --git-sha "$GITHUB_SHA"

      - name: Upload sanitized parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-parity-canary
          path: artifacts/tv-parity-canary.json
          if-no-files-found: error
          retention-days: 30
