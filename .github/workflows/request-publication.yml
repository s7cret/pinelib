name: Verify compiled requests and portable checkpoints before publication
'on':
  push:
    branches: ['ops/rc6-requests-20260906']
permissions:
  contents: read
concurrency:
  group: rc6-request-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pine2ast
          ref: 8627c94308f4cbd96b2a2ce8ad54e17530c312fd
          path: publisher-source
          sparse-checkout: .github/requests/restore.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp publisher-source/.github/requests/restore.py "$RUNNER_TEMP/restore.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0 tzdata==2026.2
      - name: Regenerate manifest and restore exact reviewed commits
        run: |
          python "$RUNNER_TEMP/restore.py" restore .github/requests/plan.json "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Install clean source copy
        run: |
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m pip install "$RUNNER_TEMP/build-source[dev]"
      - name: Complete runtime functional suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/pinelib.xml"
      - name: Changed source lint and distribution builds
        run: |
          python -m ruff check pinelib/abi/catalog.py pinelib/abi/compiled_request.py pinelib/abi/manifest_v2_builder.py pinelib/abi/primitives.py pinelib/request/snapshots.py pinelib/request/alignment.py pinelib/request/engine.py pinelib/runtime/session.py tests/test_compiled_requests.py tests/test_checkpoint_na_roundtrip.py
          python -m compileall -q pinelib
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/evidence/environment.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requests-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: requests-3.13-${{ github.run_id }}
          path: evidence
      - name: Fast-forward verified RC6 and archive the temporary delivery branch
        run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requests-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
