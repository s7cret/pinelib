name: Verify reference state and shared loop budgets before publication
'on':
  push:
    branches: ['ops/stage2-values-20260907']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pine2ast
          ref: 35f037e7b46a188441097131c6defa3ce9043680
          path: publisher
          sparse-checkout: .github/stage2-values/restore.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp publisher/.github/stage2-values/restore.py "$RUNNER_TEMP/restore.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Restore exact source and regenerate reviewed ABI manifest
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 build==1.6.0 hatchling==1.32.0 tzdata==2026.2 pytest==9.1.1 ruff==0.16.6
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/stage2-values')
          (p/'source.gz.b64').write_text(''.join((p/f'part{i}.b64').read_text() for i in range(1,5)))
          PY
          python "$RUNNER_TEMP/restore.py" restore .github/stage2-values "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/restore.py" "$RUNNER_TEMP/evidence/restore.py"
      - name: Full runtime suite and clean builds
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          python -m pip install "$RUNNER_TEMP/source"
          python -m pytest -q --junitxml="$RUNNER_TEMP/evidence/pinelib.xml"
          python - <<'PY'
          import os,subprocess,xml.etree.ElementTree as ET
          cases=list(ET.parse(os.environ['RUNNER_TEMP']+'/evidence/pinelib.xml').iter('testcase'))
          assert len(cases)==330
          assert not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped'))
          changed=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD','--','*.py'],text=True).splitlines()
          subprocess.run(['python','-m','ruff','check',*changed],check=True)
          PY
          python -m compileall -q pinelib
          python -m build --no-isolation --outdir "$RUNNER_TEMP/evidence/dist" "$RUNNER_TEMP/source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/evidence/source.tar.gz" HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: values-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: values-3.13-${{ github.run_id }}
          path: evidence
      - run: python evidence/restore.py publish evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: values-publication-${{ github.run_id }}
          path: evidence/
          retention-days: 30
