name: Verify and publish reviewed RC6 objects
on:
  push:
    branches: ['ops/rc6-review-publication-*']
    paths: ['.github/maintenance/reviewed-series-v2.json']
permissions:
  contents: read
concurrency:
  group: reviewed-rc6-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install verification tools
        run: >-
          python -m pip install
          pytest==9.1.1 pytest-cov==7.1.0 tzdata==2026.2 jsonschema==4.26.0
          setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0 build==1.6.0
          httpx==0.28.1 typing-extensions==4.16.0
      - name: Reconstruct and verify every reviewed Git object
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-evidence"
          cp .github/maintenance/reviewed-series-v2.json "$RUNNER_TEMP/review-evidence/submission.json"
          python - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, re, subprocess, sys
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-evidence'
          submission = json.loads((evidence / 'submission.json').read_text())
          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], **kwargs)
          def digest(value):
              return isinstance(value, str) and re.fullmatch('[0-9a-f]{40}', value)
          if submission['target'] != 'release/5.0.0rc6' or not digest(submission['base']) or not digest(submission['head']):
              raise SystemExit('Invalid candidate identity')
          expected = submission['expected_target']
          if expected is not None and not digest(expected):
              raise SystemExit('Invalid expected target')
          remote = git('ls-remote', 'origin', 'refs/heads/' + submission['target'], text=True).split()
          if (remote[0] if remote else None) != expected:
              raise SystemExit('Target moved: review again instead of overwriting')
          packed = base64.b64decode(submission['gzip_base64'], validate=True)
          if len(packed) > 4000000 or hashlib.sha256(packed).hexdigest() != submission['sha256']:
              raise SystemExit('Submission checksum or size mismatch')
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              decoded = stream.read(64000001)
          if len(decoded) > 64000000:
              raise SystemExit('Decoded submission too large')
          series = json.loads(decoded)
          if series['schema'] != 'openpine.reviewed-series.v2' or series['repository'] != os.environ['GITHUB_REPOSITORY'] or series['base'] != submission['base'] or series['head'] != submission['head']:
              raise SystemExit('Source identity mismatch')
          allowed = {'openpine-contracts', 'pine2ast', 'ast2python', 'pinelib', 'backtest_engine', 'marketdata-provider', 'optimizer'}
          dependencies = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-dependencies'
          dependencies.mkdir()
          for name, sha in submission.get('dependencies', {}).items():
              if name not in allowed or not digest(sha):
                  raise SystemExit('Invalid dependency identity')
              target = dependencies / name
              subprocess.run(['git','clone','https://github.com/s7cret/' + name + '.git',str(target)],check=True)
              subprocess.run(['git','-C',str(target),'checkout','--detach',sha],check=True)
              subprocess.run([sys.executable,'-m','pip','install','--no-deps','--no-build-isolation',str(target)],check=True)
          subprocess.run(['git','checkout','--detach',series['base']],check=True)
          root = pathlib.Path.cwd().resolve()
          for commit in series['commits']:
              if git('rev-parse','HEAD',text=True).strip() != commit['parent']:
                  raise SystemExit('Non-contiguous commit series')
              recipes = []
              for item in commit['files']:
                  path = item['path']
                  parts = pathlib.PurePosixPath(path).parts
                  if not parts or '..' in parts or path.startswith('/') or parts[0] in {'.git','.github'}:
                      raise SystemExit('Unsafe path')
                  destination = root / path
                  if not destination.resolve().is_relative_to(root) or destination.is_symlink():
                      raise SystemExit('Path escapes the reviewed source')
                  existing = git('ls-tree','HEAD','--',path,text=True).split()
                  actual_base = existing[2] if existing else None
                  if actual_base != item['base']:
                      raise SystemExit('Base blob mismatch: ' + path)
                  if item['mode'] == '000000':
                      subprocess.run(['git','rm','--',path],check=True)
                      continue
                  if item['mode'] not in {'100644','100755'}:
                      raise SystemExit('Invalid file mode')
                  if item.get('regenerate'):
                      if os.environ['GITHUB_REPOSITORY'] != 's7cret/pinelib' or path != 'pinelib/abi/target_manifest.json' or item['regenerate'] != 'pinelib-manifest':
                          raise SystemExit('Unrecognized generated artifact')
                      recipes.append(item)
                      continue
                  lines = [] if actual_base is None else git('cat-file','blob',actual_base).decode('utf-8').splitlines(keepends=True)
                  output, cursor = [], 0
                  for start, end, replacement in item['edits']:
                      if type(start) is not int or type(end) is not int or not (cursor <= start <= end <= len(lines)) or not isinstance(replacement,str):
                          raise SystemExit('Invalid line edit')
                      output.extend(lines[cursor:start]); output.append(replacement); cursor = end
                  output.extend(lines[cursor:])
                  raw = ''.join(output).encode('utf-8')
                  if hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() != item['sha']:
                      raise SystemExit('Reviewed blob mismatch: ' + path)
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(raw)
                  destination.chmod(0o755 if item['mode'] == '100755' else 0o644)
                  subprocess.run(['git','add','--',path],check=True)
              for item in recipes:
                  subprocess.run([sys.executable,'-m','pinelib.abi','build'],check=True)
                  if git('hash-object',item['path'],text=True).strip() != item['sha']:
                      raise SystemExit('Generated ABI differs from the reviewed artifact')
                  subprocess.run(['git','add','--',item['path']],check=True)
              if git('write-tree',text=True).strip() != commit['tree']:
                  raise SystemExit('Reviewed tree mismatch')
              raw = commit['raw_commit'].encode('utf-8')
              headers = raw.split(b'\n\n',1)[0].decode().splitlines()
              if headers[0] != 'tree ' + commit['tree'] or [h for h in headers if h.startswith('parent ')] != ['parent ' + commit['parent']]:
                  raise SystemExit('Commit header mismatch')
              stored = git('hash-object','-t','commit','-w','--stdin',input=raw).decode().strip()
              if stored != commit['sha']:
                  raise SystemExit('Reviewed commit mismatch')
              subprocess.run(['git','reset','--hard',stored],check=True)
          if git('rev-parse','HEAD',text=True).strip() != submission['head']:
              raise SystemExit('Wrong final candidate')
          subprocess.run(['git','diff','--check',series['base'],'HEAD'],check=True)
          subprocess.run([sys.executable,'-m','pip','install','--no-deps','--no-build-isolation','.'],check=True)
          (evidence / 'head').write_text(submission['head'])
          (evidence / 'source-series.json').write_bytes(decoded)
          subprocess.run(['git','update-ref','refs/heads/reviewed-source',submission['head']],check=True)
          subprocess.run(['git','bundle','create',str(evidence / 'reviewed.bundle'),'reviewed-source'],check=True)
          PY
      - name: Run the complete functional test suite
        run: python -m pytest -q --no-cov --junitxml="$RUNNER_TEMP/review-evidence/pytest.xml"
      - name: Build the reviewed distribution
        run: |
          python -m build --no-isolation --outdir "$RUNNER_TEMP/review-evidence/dist"
          python -m pip freeze > "$RUNNER_TEMP/review-evidence/environment.txt"
          git status --porcelain > "$RUNNER_TEMP/review-evidence/post-test-worktree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-3.13-${{ github.run_id }}
          path: evidence
      - name: Fast-forward only the reviewed candidate, never main or stable releases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          submission = json.loads(pathlib.Path('evidence/submission.json').read_text())
          target = submission['target']
          if target != 'release/5.0.0rc6':
              raise SystemExit('Wrong publication target')
          output = subprocess.check_output(['git','ls-remote','origin','refs/heads/' + target],text=True).split()
          if (output[0] if output else None) != submission['expected_target']:
              raise SystemExit('Target moved during verification; nothing overwritten')
          subprocess.run(['git','fetch','evidence/reviewed.bundle','reviewed-source'],check=True)
          actual = subprocess.check_output(['git','rev-parse','FETCH_HEAD'],text=True).strip()
          if actual != submission['head']:
              raise SystemExit('Evidence head mismatch')
          subprocess.run(['git','push','origin',actual + ':refs/heads/' + target],check=True)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as report:
              report.write('Published exact reviewed candidate `' + actual + '`. Python 3.11/3.13 functional tests and distribution builds passed. This is not TradingView parity or coverage-threshold approval.\n')
          PY
