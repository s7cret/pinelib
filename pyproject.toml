[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinelib"
version = "5.0.0rc6"
description = "Version-exact transactional Pine runtime target"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["tzdata==2026.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pinelib*"]

[tool.setuptools.package-data]
pinelib = ["py.typed"]
"pinelib.abi" = ["target_manifest.json", "official_pine_v6_surface.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["pinelib"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
